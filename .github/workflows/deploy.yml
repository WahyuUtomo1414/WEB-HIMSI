name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to hosting
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit built assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/build
          if git diff --cached --quiet; then
            echo "No built asset changes to commit."
            exit 0
          fi
          git commit -m "Build frontend assets [skip ci]"
          git push origin HEAD:main

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy script
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" deployment/deploy.sh "$SSH_USER@$SSH_HOST:/tmp/laravel-deploy-${{ github.run_id }}.sh"

      - name: Run deploy
        shell: bash
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail
          remote_env="$(printf 'DEPLOY_PATH=%q DEPLOY_BRANCH=%q' "$DEPLOY_PATH" "$DEPLOY_BRANCH")"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "$remote_env bash /tmp/laravel-deploy-${{ github.run_id }}.sh"

      - name: Cleanup remote script
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "rm -f /tmp/laravel-deploy-${{ github.run_id }}.sh" || true
